name: iPhone calendar release gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iphone-calendar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webkit-iphone-calendar:
    name: WebKit iPhone calendar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify Playwright package and image versions match
        run: pnpm --filter @workspace/chalet-marketplace check:playwright-image-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run isolated iPhone calendar release gate
        run: pnpm --filter @workspace/chalet-marketplace test:e2e:iphone-calendar

      - name: Run owner dashboard calendar integration check
        run: >-
          pnpm --filter @workspace/chalet-marketplace exec playwright test
          e2e/dashboard-calendar-iphone.spec.ts
          --project=webkit-iphone
          --trace=retain-on-failure

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-calendar-playwright-${{ github.run_attempt }}
          path: |
            artifacts/chalet-marketplace/test-results/
            artifacts/chalet-marketplace/playwright-report/
          if-no-files-found: warn
          retention-days: 14
