result: &result
  "200":
    description: Photography operation result
    content:
      application/json:
        schema:
          type: object
          additionalProperties: true
body: &body
  required: true
  content:
    application/json:
      schema:
        type: object
        additionalProperties: true
id: &id
  name: id
  in: path
  required: true
  schema: { type: integer }
token: &token
  name: token
  in: path
  required: true
  schema: { type: string }
status:
  get:
    operationId: getPhotographyStatus
    summary: Feature state and provider readiness, disabled by default
    responses: *result
catalog:
  get:
    operationId: getPhotographyCatalog
    summary: Owner-scoped approved properties and service activities, packages and approved photographers
    responses: *result
slots:
  get:
    operationId: getPhotographySlots
    parameters:
      - { name: propertyId, in: query, required: false, schema: { type: integer, minimum: 1 }, description: Approved property submission ID; provide exactly one target }
      - { name: serviceSubmissionId, in: query, required: false, schema: { type: integer, minimum: 1 }, description: Approved service submission ID; provide exactly one target }
      - { name: photographerId, in: query, required: false, schema: { type: integer }, description: Legacy hint only; automatic allocation ignores caller-selected photographers }
      - { name: date, in: query, required: true, schema: { type: string, format: date } }
    responses: *result
bookings:
  get:
    operationId: getPhotographyBookings
    responses: *result
  post:
    operationId: createPhotographyBooking
    summary: Atomic 15-minute slot hold with frozen package and commission quote
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "./openapi.yaml#/components/schemas/PhotographyReservationInput"
    responses: *result
checkout:
  parameters: [*id]
  post:
    operationId: checkoutPhotographyBooking
    summary: Create a hosted Moyasar invoice for a valid owned slot hold
    requestBody: *body
    responses: *result
confirm:
  parameters: [*id]
  post:
    operationId: confirmPhotographyBooking
    summary: Verify invoice amount, currency and paid state server-side before confirmation
    responses: *result
invite:
  parameters: [*token]
  get:
    operationId: getPhotographyInvite
    responses: *result
  post:
    operationId: acceptPhotographyInvite
    summary: Consume an expiring one-use invite and submit photographer application
    requestBody: *body
    responses: *result
portal:
  get:
    operationId: getPhotographerPortal
    responses: *result
  patch:
    operationId: updatePhotographerProfile
    summary: Save profile, geographic coverage, session duration and weekly availability
    requestBody: *body
    responses: *result
login:
  post:
    operationId: loginPhotographer
    requestBody: *body
    responses: *result
logout:
  post:
    operationId: logoutPhotographer
    responses: *result
admin:
  get:
    operationId: getPhotographyAdministration
    summary: Superadmin-only photographers, packages, bookings and notification delivery state
    responses:
      "200":
        description: Photography administration with durable owner names for session bookings
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotographyAdminResult"
settings:
  patch:
    operationId: updatePhotographySettings
    requestBody: *body
    responses: *result
packages:
  post:
    operationId: createPhotographyPackage
    requestBody: *body
    responses: *result
package:
  parameters: [*id]
  patch:
    operationId: updatePhotographyPackage
    requestBody: *body
    responses: *result
invites:
  post:
    operationId: invitePhotographer
    summary: Expiring invite path and WhatsApp manual share; optional real automatic template send
    requestBody: *body
    responses: *result
photographer:
  parameters: [*id]
  patch:
    operationId: reviewPhotographer
    requestBody: *body
    responses: *result
deliver:
  parameters: [*id]
  post:
    operationId: deliverPhotographySession
    summary: Assigned photographer confirms delivery after the session ends
    responses: *result
cancel:
  parameters: [*id]
  post:
    operationId: declinePhotographySession
    summary: Record mandatory reason and atomically reassign the paid session without notifying the owner when a replacement exists
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PhotographyDeclineInput" }
    responses: *result
review:
  parameters: [*id]
  post:
    operationId: ratePhotographySession
    summary: Booking owner submits one rating after confirmed delivery; ratings below 3.5 exclude automatic allocation
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PhotographyRatingInput" }
    responses: *result
reassign:
  parameters: [*id]
  post:
    operationId: retryPhotographyAssignment
    summary: Superadmin retries automatic assignment of a paid session awaiting urgent review without changing payment or its time
    responses: *result
readAlert:
  parameters: [*id]
  post:
    operationId: readPhotographyOperationalAlert
    summary: Superadmin acknowledges a persisted operational alert without changing eligibility
    responses: *result
components:
  schemas:
    PhotographyDeclineInput:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, enum: [emergency, equipment, personal, other] }
        details: { type: string, maxLength: 2000 }
    PhotographyRatingInput:
      type: object
      additionalProperties: false
      required: [stars]
      properties:
        stars: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, maxLength: 1000 }
    PhotographyAdminResult:
      type: object
      required: [bookings]
      properties:
        bookings:
          type: array
          items:
            $ref: "#/components/schemas/PhotographyAdminBooking"
      additionalProperties: true
    PhotographyAdminBooking:
      type: object
      required: [id, ownerName, propertyName, photographerName, startAt, status]
      properties:
        id: { type: integer }
        ownerName: { type: ["string", "null"], description: Registered owner name resolved by durable account identity }
        propertyName: { type: string }
        photographerName: { type: string }
        startAt: { type: string, format: date-time }
        status: { type: string }
      additionalProperties: true
