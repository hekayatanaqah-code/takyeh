openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: chalets
    description: Chalet rental listings
  - name: submissions
    description: Owner chalet submission requests
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: storage
    description: Object storage operations
  - name: admin
    description: Superadmin owner management operations
paths:
  /providers/global-seasons:
    get:
      operationId: listServiceGlobalSeasons
      tags: [providers]
      summary: List active platform-managed seasons for service providers
      responses:
        "200":
          description: Active shared definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceGlobalSeason"
        "401":
          description: Authentication required
  /providers/my/approved/{id}/seasons:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      operationId: listServiceSeasons
      tags: [providers]
      summary: List owner-scoped service seasons with current public definitions
      responses:
        "200":
          description: Registered seasons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceSeason"
        "404":
          description: Provider not owned by caller
    post:
      operationId: createServiceSeason
      tags: [providers]
      summary: Register a public season or create a private season
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceSeasonInput"
      responses:
        "201":
          description: Registered season
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceSeason"
        "404":
          description: Provider not owned by caller
        "409":
          description: Public season already registered for this provider
        "422":
          description: Invalid dates or public season unavailable
  /providers/my/approved/{id}/seasons/{seasonId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - name: seasonId
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    patch:
      operationId: updateServiceSeason
      tags: [providers]
      summary: Update private season details or owner notes for a public season
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateServiceSeasonInput"
      responses:
        "200":
          description: Updated season
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceSeason"
        "404":
          description: Season not owned by caller or belongs to another provider
        "422":
          description: Invalid dates or attempted modification of shared definition
    delete:
      operationId: deleteServiceSeason
      tags: [providers]
      summary: Remove a season from this service without changing its public definition
      responses:
        "200":
          description: Season removed
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        "404":
          description: Season not owned by caller or belongs to another provider
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /chalets:
    get:
      operationId: getChalets
      tags: [chalets]
      summary: List chalets
      description: Returns a list of available chalets with optional filtering
      parameters:
        - name: location
          in: query
          schema:
            type: string
          description: Filter by city name
        - name: maxGuests
          in: query
          schema:
            type: integer
          description: Minimum number of guests the chalet must accommodate
        - name: maxPrice
          in: query
          schema:
            type: number
          description: Maximum price per night
      responses:
        "200":
          description: List of chalets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Chalet"

  /chalets/{id}:
    get:
      operationId: getChaletById
      tags: [chalets]
      summary: Get chalet by ID
      description: Returns a single chalet's full details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Chalet detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chalet"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/owners/{ownerId}/free-access:
    post:
      operationId: grantOwnerFreeAccess
      tags: [admin]
      summary: Grant an owner free full access
      parameters:
        - name: ownerId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerFreeAccessGrantInput"
      responses:
        "201":
          description: Free full access granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerFreeAccessGrantResponse"
        "400":
          description: Invalid grant request
        "403":
          description: Superadmin access required
        "404":
          description: Owner not found

  /admin/broadcast/recipients:
    get:
      operationId: getAdminBroadcastRecipients
      tags: [admin]
      summary: List eligible broadcast recipients
      description: Returns display names and opted-in channels without private contact details.
      parameters:
        - name: audience
          in: query
          required: true
          schema:
            type: string
            enum: [all, active, providers]
        - name: channels
          in: query
          required: false
          description: Optional comma-separated channel selection.
          schema:
            type: string
      responses:
        "200":
          description: Eligible recipients, bounded to 5000 records and a 1 MiB response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBroadcastRecipientsResponse"
        "400":
          description: Invalid audience or channel selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Audience or response exceeds the supported limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      responses:
        '302':
          description: Redirect to the returnTo path on success.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.

  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestUploadUrlBody"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestUploadUrlResponse"

  /submissions/check-identity:
    post:
      operationId: checkPropertyIdentity
      tags: [submissions]
      summary: Check property identity before proceeding with registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyIdentityInput"
      responses:
        "200":
          description: Duplicate flags and an optional same-name warning
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyIdentityResult"
        "400":
          description: Invalid identity fields
        "401":
          description: Authentication required
  /submissions:
    get:
      operationId: getMySubmissions
      tags: [submissions]
      summary: Get the authenticated owner's chalet submissions
      responses:
        "200":
          description: List of the owner's submissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChaletSubmission"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createSubmission
      tags: [submissions]
      summary: Submit a chalet for review
      description: Allows property owners to submit their chalet for listing review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubmissionRequest"
      responses:
        "201":
          description: Submission received successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    ServiceGlobalSeason:
      type: object
      required: [id, nameAr, startDate, endDate]
      properties:
        id:
          type: integer
        nameAr:
          type: string
        startDate:
          type: string
        endDate:
          type: string
    CreateServiceSeasonInput:
      type: object
      description: Supply globalSeasonId for a shared definition; otherwise name, startDate and endDate are required. Shared name and dates are server-owned.
      properties:
        globalSeasonId:
          type: [integer, 'null']
          minimum: 1
        name:
          type: string
          minLength: 1
        startDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        endDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        priceLabel:
          type: [string, 'null']
        multiplier:
          type: string
          default: "1.00"
        isActive:
          type: boolean
          default: true
    UpdateServiceSeasonInput:
      type: object
      description: Public season names and dates cannot be edited here.
      properties:
        name:
          type: string
          minLength: 1
        startDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        endDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        priceLabel:
          type: [string, 'null']
        multiplier:
          type: string
        isActive:
          type: boolean
    ServiceSeason:
      type: object
      required: [id, providerId, ownerId, globalSeasonId, name, startDate, endDate, priceLabel, multiplier, isActive, createdAt]
      properties:
        id:
          type: integer
        providerId:
          type: integer
        ownerId:
          type: string
        globalSeasonId:
          type: [integer, 'null']
        name:
          type: string
        startDate:
          type: string
        endDate:
          type: string
        priceLabel:
          type: [string, 'null']
        multiplier:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
    AdminBroadcastRecipient:
      type: object
      properties:
        key:
          type: string
          description: Opaque response-local identifier; not an account or contact identifier.
        name:
          type: string
          description: Display name from the verified owner/application account.
        channels:
          type: array
          items:
            type: string
            enum: [inApp, inbox, email, whatsapp]
      required: [key, name, channels]

    AdminBroadcastRecipientsResponse:
      type: object
      properties:
        total:
          type: integer
        recipients:
          type: array
          items:
            $ref: "#/components/schemas/AdminBroadcastRecipient"
      required: [total, recipients]

    OwnerFreeAccessGrantInput:
      type: object
      additionalProperties: false
      properties:
        duration:
          type: string
          enum: [unlimited, fixed]
        days:
          type: integer
          minimum: 1
          maximum: 3650
          description: Required when duration is fixed; omitted for unlimited access.
        reason:
          type: string
          minLength: 5
          maxLength: 500
      required: [duration, reason]

    OwnerFreeAccessGrantResponse:
      type: object
      properties:
        freeAccess:
          $ref: "#/components/schemas/OwnerFreeAccess"
      required: [freeAccess]

    OwnerFreeAccess:
      type: object
      properties:
        active:
          type: boolean
        expiresAt:
          type: [string, "null"]
          format: date-time
        reason:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [active, expiresAt, reason, createdAt]

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'

    ChaletSubmission:
      type: object
      properties:
        id:
          type: integer
        ownerId:
          type: [string, 'null']
        nameAr:
          type: string
        whatsappNumber:
          type: string
        location:
          type: string
        region:
          type: string
        websiteUrl:
          type: [string, 'null']
        descriptionAr:
          type: string
        pricePerNight:
          type: number
        photos:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - nameAr
        - whatsappNumber
        - location
        - descriptionAr
        - pricePerNight
        - photos
        - status
        - createdAt

    RequestUploadUrlBody:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
        size:
          type: integer
        contentType:
          type: string

    RequestUploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
        objectPath:
          type: string

    PropertyIdentityInput:
      type: object
      required: [nameAr, location, district, whatsappNumber]
      properties:
        nameAr:
          type: string
          minLength: 2
        location:
          type: string
          minLength: 2
        district:
          type: string
          minLength: 1
        whatsappNumber:
          type: string
    PropertyIdentityResult:
      type: object
      required: [available, fieldErrors, warning]
      properties:
        available:
          type: boolean
        fieldErrors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        warning:
          type: [string, "null"]
    CreateSubmissionRequest:
      type: object
      properties:
        nameAr:
          type: string
          description: Chalet name in Arabic
        whatsappNumber:
          type: string
          description: Owner WhatsApp number
        location:
          type: string
          description: City name
        region:
          type: string
          description: Region name
        suggestedCityName:
          type: string
          description: Owner-proposed city when it is not in the catalog
        district:
          type: string
          minLength: 1
          description: Required district or neighborhood name
        propertyType:
          type: string
          description: Property type (شالية، مزرعة، استراحة، مخيم)
        sections:
          type: string
          description: Number of sections (قسم واحد، قسمين منفصلة)
        mapsUrl:
          type: string
          description: Optional Google Maps or website link
        socialLink:
          type: string
          description: Instagram or Snapchat profile link for verification
        descriptionAr:
          type: string
          description: Chalet description in Arabic
        pricePerNight:
          type: number
          description: Average price per night in SAR
        amenities:
          type: array
          items:
            type: string
          description: List of selected amenity keys
        photos:
          type: array
          minItems: 1
          maxItems: 15
          items:
            type: string
          description: Uploaded photos; the first is the required main photo
        termsAndConditions:
          type: string
          minLength: 1
      required:
        - nameAr
        - whatsappNumber
        - location
        - region
        - descriptionAr
        - pricePerNight
        - district
        - photos
        - termsAndConditions

    SubmissionResponse:
      type: object
      properties:
        id:
          type: integer
        message:
          type: string
      required:
        - id
        - message

    Chalet:
      type: object
      properties:
        id:
          type: integer
        nameAr:
          type: string
          description: Chalet name in Arabic
        descriptionAr:
          type: string
          description: Chalet description in Arabic
        location:
          type: string
          description: City name in Arabic
        district:
          type: string
          nullable: true
          description: District or neighbourhood
        category:
          type: string
          nullable: true
          description: Chalet category (e.g. شالية، مزرعة)
        propertyType:
          type: string
          nullable: true
          description: Property type (شالية، مزرعة، استراحة، مخيم)
        sections:
          type: string
          nullable: true
          description: Number of sections (قسم واحد، قسمين منفصلة)
        pricePerNight:
          type: number
          description: Price per night in SAR
        priceMorning:
          type: [number, 'null']
        priceEvening:
          type: [number, 'null']
        priceFullDay:
          type: [number, 'null']
        priceWeekday:
          type: [number, 'null']
        priceWeekend:
          type: [number, 'null']
        maxGuests:
          type: integer
          description: Maximum number of guests
        bedrooms:
          type: integer
          description: Number of bedrooms
        amenities:
          type: array
          items:
            type: string
          description: List of amenities in Arabic
        photos:
          type: array
          items:
            type: string
          description: List of photo URLs
        whatsappNumber:
          type: string
          description: WhatsApp phone number for booking
        mapsUrl:
          type: string
          nullable: true
          description: Google Maps URL with exact pin coordinates (e.g. https://maps.google.com/maps?q=26.329,43.975)
        isVerified:
          type: boolean
          description: Admin-verified chalet with confirmed social media identity
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - nameAr
        - descriptionAr
        - location
        - pricePerNight
        - maxGuests
        - bedrooms
        - amenities
        - photos
        - whatsappNumber
        - createdAt
