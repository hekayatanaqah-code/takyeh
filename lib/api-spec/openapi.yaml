          properties:
            ownerId: { type: string }
            updatedAt: { type: [string, "null"], format: date-time }
    ChaletFacilityInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        category: { type: [string, "null"], maxLength: 100 }
        description: { type: [string, "null"], maxLength: 500 }
        price: { type: number, minimum: 0 }
        unit: { type: string, maxLength: 100 }
        imageUrl: { type: [string, "null"] }
        galleryPhotos:
          type: [array, "null"]
          maxItems: 10
          items:
            type: object
            required: [url, caption]
            properties:
              url: { type: string, minLength: 1 }
              caption: { type: string, maxLength: 200 }
        minPersons: { type: [integer, "null"], minimum: 0 }
        maxPersons: { type: [integer, "null"], minimum: 0 }
        maxQuantity: { type: [integer, "null"], minimum: 0, maximum: 1000000, description: "Per-booking quantity cap; null is unlimited, zero is unavailable." }
        isActive: { type: boolean }
    ChaletFacility:
      type: object
      required: [id, chaletId, name, category, description, price, unit, imageUrl, galleryPhotos, isActive, minPersons, maxPersons, maxQuantity, createdAt]
      properties:
        id: { type: integer }
        chaletId: { type: integer }
        name: { type: string }
        category: { type: [string, "null"] }
        description: { type: [string, "null"] }
        price: { type: string }
        unit: { type: string }
        imageUrl: { type: [string, "null"] }
        galleryPhotos: { type: [array, "null"], items: { type: object, required: [url, caption], properties: { url: { type: string }, caption: { type: string } } } }
        isActive: { type: boolean }
        minPersons: { type: [integer, "null"] }
        maxPersons: { type: [integer, "null"] }
        maxQuantity: { type: [integer, "null"] }
        createdAt: { type: string }
    CrmDirectoryCustomer:
      type: object
      required: [client_name, client_phone, total_bookings, total_revenue, last_booking_date, source, providers, has_active]
      properties:
        client_name: { type: string }
        client_phone: { type: string }
        total_bookings: { type: integer }
        total_sales: { type: integer }
        total_revenue: { type: number }
        last_booking_date: { type: string }
        source: { type: string, enum: [chalet, service, both] }
        providers: { type: array, items: { type: string } }
        has_active: { type: boolean }
    CrmCustomerPage:
      type: object
      required: [items, total, totalCustomers, page, pageSize, totalPages]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/CrmDirectoryCustomer" } }
        total: { type: integer }
        totalCustomers: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        totalPages: { type: integer }
    CrmCustomerSummary:
      type: object
      required: [clientName, clientPhone, clientIdNumber, totalBookings, totalRevenue, lastBookingDate, contractCount, insuranceCount, note]
      properties:
        clientName: { type: string }
        clientPhone: { type: string }
        clientIdNumber: { type: [string, "null"] }
        totalBookings: { type: integer }
        totalSales: { type: integer }
        totalRevenue: { type: number }
        lastBookingDate: { type: string }
        contractCount: { type: integer }
        insuranceCount: { type: integer }
        note: { type: string }
    CrmHistoryRecord:
      type: object
      required: [id, booking_date, duration_days, period, total_price, chalet_name, cancelled_at, cancelled, contract_signed, insurance_fee, insurance_received, insurance_refunded, insurance_deducted, original_date, rescheduled_at, is_active]
      properties:
        id: { type: integer }
        record_type: { type: string, enum: [booking, quick_sale] }
        item_summary: { type: string }
        payment_method: { type: string }
        cancellation_reason: { type: [string, "null"] }
        booking_date: { type: string }
        duration_days: { type: [integer, "null"] }
        period: { type: [string, "null"] }
        total_price: { type: string }
        chalet_name: { type: [string, "null"] }
        cancelled_at: { type: [string, "null"] }
        cancelled: { type: boolean }
        contract_signed: { type: boolean }
