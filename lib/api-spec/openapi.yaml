openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: chalets
    description: Chalet rental listings
  - name: submissions
    description: Owner chalet submission requests
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: storage
    description: Object storage operations
  - name: admin
    description: Superadmin owner management operations
paths:
  /admin/photography/policy:
    $ref: "./photography.yaml#/policy"
  /admin/photography/options:
    $ref: "./photography.yaml#/options"
  /photography/portal/bookings/{id}/uploads/request:
    $ref: "./photography.yaml#/sessionUpload"
  /photography/bookings/{id}/files/{index}:
    $ref: "./photography.yaml#/sessionFile"
  /photography/status:
    $ref: "./photography.yaml#/status"
  /photography/catalog:
    $ref: "./photography.yaml#/catalog"
  /photography/slots:
    $ref: "./photography.yaml#/slots"
  /photography/bookings:
    $ref: "./photography.yaml#/bookings"
  /photography/bookings/{id}/checkout:
    $ref: "./photography.yaml#/checkout"
  /photography/bookings/{id}/confirm:
    $ref: "./photography.yaml#/confirm"
  /photography/portal/login:
    $ref: "./photography.yaml#/login"
  /photography/portal/logout:
    $ref: "./photography.yaml#/logout"
  /admin/photography:
    $ref: "./photography.yaml#/admin"
  /admin/photography/finance:
    $ref: "./photography-finance.yaml#/admin"
  /admin/photography/receipt/upload-url:
    $ref: "./photography-finance.yaml#/upload"
  /admin/photography/receipt/complete:
    $ref: "./photography-finance.yaml#/complete"
  /admin/photography/bookings/{id}/refunds:
    $ref: "./photography-finance.yaml#/refunds"
  /admin/photography/refunds/{id}/reconcile:
    $ref: "./photography-finance.yaml#/reconcile"
  /photography/portal/statement:
    $ref: "./photography-finance.yaml#/statement"
  /photography/receipts/{id}:
    $ref: "./photography-finance.yaml#/receipt"
  /photography/bookings/{id}/wallet-pay:
    $ref: "./photography-finance.yaml#/pay"
  /owner/wallet:
    $ref: "./photography-finance.yaml#/wallet"
  /owner/subscription/wallet-pay:
    $ref: "./photography-finance.yaml#/subscription"
  /admin/photography/settings:
    $ref: "./photography.yaml#/settings"
  /admin/photography/packages:
    $ref: "./photography.yaml#/packages"
  /admin/photography/packages/{id}:
    $ref: "./photography.yaml#/package"
  /admin/photography/invites:
    $ref: "./photography.yaml#/invites"
  /admin/photography/photographers/{id}:
    $ref: "./photography.yaml#/photographer"
  /providers/global-seasons:
    get:
      operationId: listServiceGlobalSeasons
      tags: [providers]
      summary: List active platform-managed seasons for service providers
      responses:
        "200":
          description: Active shared definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceGlobalSeason"
        "401":
          description: Authentication required
  /providers/my/approved/{id}/seasons:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      operationId: listServiceSeasons
      tags: [providers]
      summary: List owner-scoped service seasons with current public definitions
      responses:
        "200":
          description: Registered seasons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceSeason"
        "404":
          description: Provider not owned by caller
    post:
      operationId: createServiceSeason
      tags: [providers]
      summary: Register a public season or create a private season
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceSeasonInput"
      responses:
        "201":
          description: Registered season
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceSeason"
        "404":
          description: Provider not owned by caller
        "409":
          description: Public season already registered for this provider
        "422":
          description: Invalid dates or public season unavailable
  /providers/my/approved/{id}/seasons/{seasonId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - name: seasonId
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    patch:
      operationId: updateServiceSeason
      tags: [providers]
      summary: Update private season details or owner notes for a public season
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateServiceSeasonInput"
      responses:
        "200":
          description: Updated season
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceSeason"
        "404":
          description: Season not owned by caller or belongs to another provider
        "422":
          description: Invalid dates or attempted modification of shared definition
    delete:
      operationId: deleteServiceSeason
      tags: [providers]
      summary: Remove a season from this service without changing its public definition
      responses:
        "200":
          description: Season removed
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        "404":
          description: Season not owned by caller or belongs to another provider
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /chalets:
    get:
      operationId: getChalets
      tags: [chalets]
      summary: List chalets
      description: Returns a list of available chalets with optional filtering
      parameters:
        - name: location
          in: query
          schema:
            type: string
          description: Filter by city name
        - name: maxGuests
          in: query
          schema:
            type: integer
          description: Minimum number of guests the chalet must accommodate
        - name: maxPrice
          in: query
          schema:
            type: number
          description: Maximum price per night
      responses:
        "200":
          description: List of chalets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Chalet"

  /chalets/{id}:
    get:
      operationId: getChaletById
      tags: [chalets]
      summary: Get chalet by ID
      description: Returns a single chalet's full details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Chalet detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chalet"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/owners/{ownerId}/free-access:
    post:
      operationId: grantOwnerFreeAccess
      tags: [admin]
      summary: Grant an owner free full access
      parameters:
        - name: ownerId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerFreeAccessGrantInput"
      responses:
        "201":
          description: Free full access granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerFreeAccessGrantResponse"
        "400":
          description: Invalid grant request
        "403":
          description: Superadmin access required
        "404":
          description: Owner not found

  /admin/broadcast/recipients:
    get:
      operationId: getAdminBroadcastRecipients
      tags: [admin]
      summary: List eligible broadcast recipients
      description: Returns display names and opted-in channels without private contact details.
      parameters:
        - name: audience
          in: query
          required: true
          schema:
            type: string
            enum: [all, active, providers]
        - name: channels
          in: query
          required: false
          description: Optional comma-separated channel selection.
          schema:
            type: string
      responses:
        "200":
          description: Eligible recipients, bounded to 5000 records and a 1 MiB response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBroadcastRecipientsResponse"
        "400":
          description: Invalid audience or channel selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Audience or response exceeds the supported limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      responses:
        '302':
          description: Redirect to the returnTo path on success.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.

  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestUploadUrlBody"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestUploadUrlResponse"
  /photography/profile-image/upload-url:
    post:
      tags: [Photography]
      operationId: requestPhotographerImageUpload
      summary: Request a direct image upload using a photographer session or valid invitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotographerImageUploadRequest"
      responses:
        '200':
          description: Signed upload URL and account-bound completion proof
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotographerImageUploadGrant"
        '401':
          description: No photographer session or valid invitation
        '400':
          description: Invalid file metadata
        '503':
          description: Storage temporarily unavailable
  /photography/profile-image/complete:
    post:
      tags: [Photography]
      operationId: completePhotographerImage
      summary: Validate, sanitize, and persist an uploaded photographer portrait
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotographerImageCompletion"
      responses:
        '200':
          description: Sanitized public portrait path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotographerImageResult"
        '401':
          description: No photographer session or valid invitation
        '400':
          description: Invalid image or upload proof
  /photography/invites/{token}:
    get:
      tags: [Photography]
      operationId: getPhotographyInvite
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Invitation identity; phone cannot be changed by application input
          content:
            application/json:
              schema:
                type: object
                required: [name, whatsapp, expiresAt]
                properties:
                  name: { type: string }
                  whatsapp: { type: string }
                  expiresAt: { type: string, format: date-time }
        '410':
          description: Invitation expired or consumed
    post:
      tags: [Photography]
      operationId: acceptPhotographyInvite
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotographerApplication"
      responses:
        '200':
          description: Application persisted and photographer session issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotographerProfileResult"
        '400':
          description: Invalid profile, coverage, image ownership or password
        '410':
          description: Invitation expired or consumed
  /photography/contract:
    get:
      operationId: getPhotographyContract
      responses:
        '200':
          description: Current published contract or an empty unpublished state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhotographyContract" }
  /admin/photography/contract:
    get:
      operationId: getAdminPhotographyContract
      responses:
        '200':
          description: Current contract
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhotographyContract" }
    post:
      operationId: publishPhotographyContract
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PhotographyContractInput" }
      responses:
        '201':
          description: Sanitized immutable new contract version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhotographyContract" }
        '403': { description: Superadmin required }
  /photography/support-requests:
    get:
      operationId: getPhotographerSupport
      responses:
        '200':
          description: Own support requests with administration replies
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PhotographerSupportRequest" }
    post:
      operationId: createPhotographerSupport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PhotographerSupportInput" }
      responses:
        '201': { description: Request created in shared support inbox }
  /photography/support-requests/{id}/mark-read:
    post:
      operationId: markPhotographerSupportRead
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Own reply marked read }
        '404': { description: Request not owned by session }
  /admin/photography/photographers/{id}/transfers:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      operationId: getPhotographerTransfers
      responses:
        '200':
          description: Transfers and remaining net balance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhotographyTransferBalance" }
    post:
      operationId: recordPhotographerTransfer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PhotographyTransferInput" }
      responses:
        '201': { description: "External bank transfer recorded, no payment execution" }
        '400': { description: Invalid data or amount exceeds remaining balance }
        '409': { description: Transfer reference already recorded }
  /photography/events:
    get:
      operationId: getPhotographerEvents
      responses:
        '200':
          description: Private booking-confirmed server-sent events after committed payment confirmation
          content:
            text/event-stream:
              schema: { type: string }
        '401': { description: Photographer session required }
  /photography/notifications/{id}/read:
    post:
      operationId: markPhotographerNotificationRead
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Owned internal booking notice marked read }
        '404': { description: Notice not owned by this photographer }
  /photography/portal/bookings/{id}/deliver:
    $ref: './photography.yaml#/deliver'
  /photography/portal/bookings/{id}/cancel:
    $ref: './photography.yaml#/cancel'
  /photography/bookings/{id}/review:
    $ref: './photography.yaml#/review'
  /admin/photography/bookings/{id}/reassign:
    $ref: './photography.yaml#/reassign'
  /admin/photography/alerts/{id}/read:
    $ref: './photography.yaml#/readAlert'
  /photography/portal:
    get:
      tags: [Photography]
      operationId: getPhotographerPortal
      responses:
        '200':
          description: Photographer profile, bookings, and earnings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotographerPortalResult"
        '401':
          description: Photographer session required
    patch:
      tags: [Photography]
      operationId: updatePhotographerProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotographerProfileInput"
      responses:
        '200':
          description: Updated photographer profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotographerProfileResult"
        '400':
          description: Invalid profile, coverage or image ownership
        '401':
          description: Photographer session required

  /submissions/check-social-account:
    post:
      operationId: checkPropertySocialAccount
      tags: [submissions]
      summary: Check Instagram or Snapchat identity before the media step
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertySocialAccountInput"
      responses:
        "200":
          description: Social account availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertySocialAccountResult"
        "400":
          description: Invalid profile link or handle
        "401":
          description: Authentication required
  /submissions/check-identity:
    post:
      operationId: checkPropertyIdentity
      tags: [submissions]
      summary: Check property identity before proceeding with registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyIdentityInput"
      responses:
        "200":
          description: Duplicate flags and an optional same-name warning
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyIdentityResult"
        "400":
          description: Invalid identity fields
        "401":
          description: Authentication required
  /submissions:
    get:
      operationId: getMySubmissions
      tags: [submissions]
      summary: Get the authenticated owner's chalet submissions
      responses:
        "200":
          description: List of the owner's submissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChaletSubmission"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createSubmission
      tags: [submissions]
      summary: Submit a chalet for review
      description: Allows property owners to submit their chalet for listing review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubmissionRequest"
      responses:
        "201":
          description: Submission received successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /owner-services:
    $ref: './owner-services.yaml#/paths/~1owner-services'
  /admin/owner-services:
    $ref: './owner-services.yaml#/paths/~1admin~1owner-services'
  /admin/owner-services/order:
    $ref: './owner-services.yaml#/paths/~1admin~1owner-services~1order'
  /admin/owner-services/{id}:
    $ref: './owner-services.yaml#/paths/~1admin~1owner-services~1{id}'
  /admin/photography/photographers/{id}/profile:
    $ref: './owner-services.yaml#/paths/~1admin~1photography~1photographers~1{id}~1profile'
components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    PhotographyReservationInput:
      type: object
      additionalProperties: false
      required: [packageId, startAt]
      properties:
        propertyId: { type: integer, minimum: 1 }
        serviceSubmissionId: { type: integer, minimum: 1 }
        photographerId: { type: integer, minimum: 1 }
        packageId: { type: integer, minimum: 1 }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time, description: Selected slot end; allocation preserves this exact interval }
      oneOf:
        - required: [propertyId]
          not: { required: [serviceSubmissionId] }
        - required: [serviceSubmissionId]
          not: { required: [propertyId] }
    ServiceGlobalSeason:
      type: object
      required: [id, nameAr, startDate, endDate]
      properties:
        id:
          type: integer
        nameAr:
          type: string
        startDate:
          type: string
        endDate:
          type: string
    CreateServiceSeasonInput:
      type: object
      description: Supply globalSeasonId for a shared definition; otherwise name, startDate and endDate are required. Shared name and dates are server-owned.
      properties:
        globalSeasonId:
          type: [integer, 'null']
          minimum: 1
        name:
          type: string
          minLength: 1
        startDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        endDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        priceLabel:
          type: [string, 'null']
        multiplier:
          type: string
          default: "1.00"
        isActive:
          type: boolean
          default: true
    UpdateServiceSeasonInput:
      type: object
      description: Public season names and dates cannot be edited here.
      properties:
        name:
          type: string
          minLength: 1
        startDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        endDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        priceLabel:
          type: [string, 'null']
        multiplier:
          type: string
        isActive:
          type: boolean
    ServiceSeason:
      type: object
      required: [id, providerId, ownerId, globalSeasonId, name, startDate, endDate, priceLabel, multiplier, isActive, createdAt]
      properties:
        id:
          type: integer
        providerId:
          type: integer
        ownerId:
          type: string
        globalSeasonId:
          type: [integer, 'null']
        name:
          type: string
        startDate:
          type: string
        endDate:
          type: string
        priceLabel:
          type: [string, 'null']
        multiplier:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
    AdminBroadcastRecipient:
      type: object
      properties:
        key:
          type: string
          description: Opaque response-local identifier; not an account or contact identifier.
        name:
          type: string
          description: Display name from the verified owner/application account.
        channels:
          type: array
          items:
            type: string
            enum: [inApp, inbox, email, whatsapp]
      required: [key, name, channels]

    AdminBroadcastRecipientsResponse:
      type: object
      properties:
        total:
          type: integer
        recipients:
          type: array
          items:
            $ref: "#/components/schemas/AdminBroadcastRecipient"
      required: [total, recipients]

    OwnerFreeAccessGrantInput:
      type: object
      additionalProperties: false
      properties:
        duration:
          type: string
          enum: [unlimited, fixed]
        days:
          type: integer
          minimum: 1
          maximum: 3650
          description: Required when duration is fixed; omitted for unlimited access.
        reason:
          type: string
          minLength: 5
          maxLength: 500
      required: [duration, reason]

    OwnerFreeAccessGrantResponse:
      type: object
      properties:
        freeAccess:
          $ref: "#/components/schemas/OwnerFreeAccess"
      required: [freeAccess]

    OwnerFreeAccess:
      type: object
      properties:
        active:
          type: boolean
        expiresAt:
          type: [string, "null"]
          format: date-time
        reason:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [active, expiresAt, reason, createdAt]

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
