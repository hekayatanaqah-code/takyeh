        waPhone: { type: string }
        bookingConfirmationEnabled: { type: boolean }
        bookingConfirmationTemplate: { type: string }
        changeNoticeEnabled: { type: boolean }
        cancellationTemplate: { type: string }
        modificationTemplate: { type: string }
        detailedReceiptTemplate: { type: [string, "null"] }
        customTemplates:
          type: array
          items: { $ref: "#/components/schemas/OwnerWhatsAppTemplate" }
        attachmentNote: { type: string }
    OwnerWhatsAppSettings:
      allOf:
        - { $ref: "#/components/schemas/OwnerWhatsAppSettingsInput" }
