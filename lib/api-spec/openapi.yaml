openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: chalets
    description: Chalet rental listings
  - name: submissions
    description: Owner chalet submission requests
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: storage
    description: Object storage operations
  - name: admin
    description: Superadmin owner management operations
paths:
  /providers/city-request:
    post:
      operationId: createServiceCityRequest
      tags: [providers]
      summary: Request approval of a new service city
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceCityRequestInput"
      responses:
        "201":
          description: Saved pending request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceCityRequestRecord"
  /admin/service-city-requests:
    get:
      operationId: listServiceCityRequests
      tags: [admin]
      summary: Review service city requests
      responses:
        "200":
          description: City requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceCityRequestRecord"
  /admin/service-city-requests/{id}/decision:
    post:
      operationId: reviewServiceCityRequest
      tags: [admin]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceCityDecisionInput"
      responses:
        "200":
          description: Reviewed city request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceCityRequestRecord"
  /owner/bookings:
    get:
      operationId: listOwnerPropertyBookings
      tags: [owner]
      summary: Owner property bookings with immutable departure instants
      responses:
        "200":
          description: Non-cancelled property bookings; checkoutAt is server-owned and only repinned on an actual schedule change
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OwnerPropertyBooking" }
        "401": { description: Authentication required }
  /owner/transaction-history:
    get:
      operationId: listOwnerLedgerTransactions
      tags: [owner]
      parameters:
        - in: query
          name: submissionId
          schema: { type: integer, minimum: 1 }
        - in: query
          name: providerId
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Owner-scoped property/service receipts, sales, refunds and expenses. Select at most one activity.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OwnerLedgerTransaction" }
        "400": { description: Invalid or conflicting activity filters }
        "401": { description: Authentication required }
        "404": { description: Service is not owned by this account }
  /owner/support-requests/{id}/reply:
    post:
      operationId: replyToOwnerSupportTicket
      tags: [owner]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupportConversationReplyInput" }
      responses:
        "200":
          description: Reply appended to the open ticket.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportConversationReplyResult" }
        "400": { description: Invalid message }
        "401": { description: Authentication required }
        "404": { description: Ticket not owned by this account or not found }
        "409": { description: Ticket closed by administration }
  /owner/quick-sales/settings:
    get:
      operationId: getQuickSalesSettings
      tags: [quickSales]
      responses:
        "200":
          description: Account-wide preference
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuickSalesSettings" }
    patch:
      operationId: updateQuickSalesSettings
      tags: [quickSales]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuickSalesSettings" }
      responses:
        "200":
          description: Saved preference; history preserved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuickSalesSettings" }
  /owner/quick-sales:
    get:
      operationId: listQuickSales
      tags: [quickSales]
      parameters:
        - in: query
          name: providerId
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Owner-scoped sales history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/QuickSale" }
    post:
      operationId: createQuickSale
      tags: [quickSales]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateQuickSale" }
      responses:
        "201":
          description: Recorded sale or original idempotent result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuickSale" }
        "400": { description: Invalid data }
        "403": { description: Disabled or read only }
        "404": { description: Provider or product not owned }
        "409": { description: Duplicate key with different data }
  /owner/quick-sales/{saleId}/cancel:
    post:
      operationId: cancelQuickSale
      tags: [quickSales]
      parameters:
        - in: path
          name: saleId
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        "200":
          description: Voided accounting record, no electronic refund
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuickSale" }
        "400": { description: Invalid reason }
        "404": { description: Sale not owned }
        "409": { description: Already cancelled }
  /providers/my/approved/{id}/appointments/{apptId}/payments:
    post:
      operationId: recordServiceAppointmentPayment
      summary: Record an additional payment using the booking's existing payment method and custody status
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: apptId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceAppointmentPaymentInput"
      responses:
        "200":
          description: Updated booking with cumulative paid amount
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceAppointmentRecord"
        "404":
          description: Booking or provider not owned by authenticated user
        "409":
          description: Booking cancelled or payment snapshot changed
        "422":
          description: Invalid amount or amount exceeds current remaining balance
  /providers/my/approved/{id}/appointments/{apptId}:
    patch:
      operationId: updateServiceAppointment
      summary: Update an owned service booking without replacing it
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: apptId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceAppointmentUpdate"
      responses:
        "200":
          description: Updated booking, preserving identity and unchanged fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceAppointmentRecord"
        "404":
          description: Booking or provider not owned by the authenticated user
        "409":
          description: Target date blocked or daily capacity reached
        "422":
          description: Invalid booking data or appointment time
  /providers/my/approved/{id}/reviews/{reviewId}/report:
    post:
      operationId: submitServiceReviewObjection
      tags: [providers]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
        - { in: path, name: reviewId, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200":
          description: Objection submitted for administrative review
        "409":
          description: Review already has a pending objection
  /admin/service-reviews:
    get:
      operationId: listAdminServiceReviewObjections
      tags: [admin]
      responses:
        "200":
          description: Service reviews including pending objections
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, providerId, kind, rating, createdAt]
                  properties:
                    id: { type: integer }
                    providerId: { type: integer }
                    kind: { type: string, enum: [service] }
                    chaletName: { type: [string, "null"] }
                    rating: { type: integer }
                    comment: { type: [string, "null"] }
                    reportedBy: { type: [string, "null"] }
                    reportedAt: { type: [string, "null"], format: date-time }
                    reportReason: { type: [string, "null"] }
                    createdAt: { type: string, format: date-time }
  /admin/service-reviews/{id}/decision:
    post:
      operationId: decideServiceReviewObjection
      tags: [admin]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [keep, delete] }
      responses:
        "200":
          description: Decision applied; the owner is notified only when the review is kept
        "409":
          description: Objection no longer pending
  /providers/my/approved/{providerId}/catalog-media:
    parameters:
      - { name: providerId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    post:
      operationId: uploadProviderCatalogImage
      tags: [providers]
      description: Owner-scoped catalog image upload. JPEG, PNG or WebP up to 2 MiB, converted to WebP.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/ProviderCatalogImageUploadInput" }
      responses:
        "200":
          description: Stored public item image
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderCatalogImageUploadResult" }
        "400":
          description: Invalid image
        "401":
          description: Authentication required
        "404":
          description: Provider not owned by this account
        "413":
          description: Image exceeds 2 MiB
  /providers/my/approved/{providerId}/catalog:
    parameters:
      - { name: providerId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      operationId: getProviderCatalogItems
      tags: [providers]
      responses:
        "200":
          description: Service-scoped catalog
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ProviderCatalogItem" } }
    post:
      operationId: createProviderCatalogItem
      tags: [providers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderCatalogItemInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderCatalogItem" }
  /providers/my/approved/{providerId}/catalog/{itemId}:
    parameters:
      - { name: providerId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      - { name: itemId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    patch:
      operationId: updateProviderCatalogItem
      tags: [providers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderCatalogItemInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderCatalogItem" }
    delete:
      operationId: deleteProviderCatalogItem
      tags: [providers]
      responses:
        "204": { description: Removed from catalog }
  /providers/my/approved/{providerId}/offers:
    parameters:
      - { name: providerId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      operationId: getProviderOffers
      tags: [providers]
      responses:
        "200":
          description: Service-scoped offers
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ProviderOffer" } }
    post:
      operationId: createProviderOffer
      tags: [providers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderOfferInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderOffer" }
  /providers/my/approved/{providerId}/offers/{offerId}:
    parameters:
      - { name: providerId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      - { name: offerId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    patch:
      operationId: updateProviderOffer
      tags: [providers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderOfferInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderOffer" }
    delete:
      operationId: deleteProviderOffer
      tags: [providers]
      responses:
        "204": { description: Deleted }
  /providers/{providerId}/catalog:
    get:
      operationId: getPublicProviderCatalog
      tags: [providers]
      parameters:
        - { name: providerId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Active products with the best current offer; no changes to past bookings
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/PublicProviderCatalogItem" } }
  /owner/report-years:
    get:
      operationId: getOwnerFinancialPeriods
      tags: [owner]
      parameters:
        - name: activity
          in: query
          schema: { type: string, enum: [properties, services, unified], default: properties }
        - name: submissionId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: providerId
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Descending nonempty financial periods, excluding cancelled and future records.
          content:
            application/json:
              schema:
                type: object
                required: [gregorianYears, hijriYears, gregorianMonths, hijriMonths]
                properties:
                  gregorianYears: { type: array, items: { type: integer } }
                  hijriYears: { type: array, items: { type: integer } }
                  gregorianMonths: { type: array, items: { type: string } }
                  hijriMonths: { type: array, items: { type: string } }
        "400":
          description: Invalid activity or identifier.
        "401":
          description: Authentication required.
        "500":
          description: Financial periods could not be loaded.
  /owner/service-revenue-summary:
    get:
      operationId: getOwnerServiceRevenueSummary
      tags: [owner]
      parameters:
        - name: month
          in: query
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        - name: hijriYear
          in: query
          description: Supply together with hijriMonth instead of month.
          schema: { type: integer, minimum: 1300, maximum: 1600 }
        - name: hijriMonth
          in: query
          schema: { type: integer, minimum: 1, maximum: 12 }
      responses:
        "200":
          description: Collected service revenue in the requested Gregorian or Umm al-Qura month.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnerServiceRevenueSummary" }
        "400":
          description: Invalid or incomplete calendar period.
        "401":
          description: Authentication required.
        "403":
          description: Financial management subscription required.
  /owner/notifications:
    get:
      operationId: listOwnerNotificationHistory
      tags: [owner]
      parameters:
        - name: history
          in: query
          description: Return complete searchable history instead of the latest 50 notifications.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Owner-scoped notifications, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OwnerNotificationHistoryItem" }
        "400":
          description: Invalid query.
        "401":
          description: Authentication required.
  /owner/notifications/read-all:
    patch:
      operationId: markOwnerNotificationScopeRead
      tags: [owner]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OwnerNotificationScopeInput" }
      responses:
        "200":
          description: All notifications in the authorized activity scope marked read.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        "400":
          description: Invalid activity scope.
        "401":
          description: Authentication required.
  /owner/offers:
    get:
      operationId: listPropertyOffers
      tags: [owner]
      parameters:
        - { name: submissionId, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Property offers
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/PropertyOffer" } }
    post:
      operationId: createPropertyOffer
      tags: [owner]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PropertyOfferInput" }
      responses:
        "201":
          description: Created offer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PropertyOffer" }
  /owner/offers/{offerId}:
    parameters:
      - { name: offerId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    patch:
      operationId: updatePropertyOffer
      tags: [owner]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PropertyOfferPatch" }
      responses:
        "200":
          description: Updated offer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PropertyOffer" }
    delete:
      operationId: deletePropertyOffer
      tags: [owner]
      responses:
        "204": { description: Deleted without changing existing bookings }
  /chalets/{chaletId}/price-quote:
    get:
      operationId: getPropertyPriceQuote
      tags: [chalets]
      parameters:
        - { name: chaletId, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: date, in: query, required: true, schema: { type: string } }
        - { name: period, in: query, required: true, schema: { type: string, enum: [morning, evening, full_day] } }
        - { name: durationDays, in: query, schema: { type: integer, minimum: 1, maximum: 60, default: 1 } }
      responses:
        "200":
          description: Authoritative daily and seasonal price with the best non-stacking offer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PropertyPriceQuote" }
  /owner/price-quote:
    get:
      operationId: getOwnerPropertyPriceQuote
      tags: [owner]
      parameters:
        - { name: submissionId, in: query, required: true, schema: { type: integer, minimum: 1 } }
        - { name: date, in: query, required: true, schema: { type: string } }
        - { name: period, in: query, required: true, schema: { type: string, enum: [morning, evening, full_day] } }
        - { name: durationDays, in: query, schema: { type: integer, minimum: 1, maximum: 60, default: 1 } }
      responses:
        "200":
          description: Same price calculation used by the customer and new offer-priced bookings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PropertyPriceQuote" }
  /owner/staff/{staffId}/holdings:
    parameters:
      - { name: staffId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      operationId: listStaffHoldings
      tags: [owner]
      responses:
        "200":
          description: Employee-scoped custody and deposit register
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StaffHolding" }
        "404": { description: Employee not found }
    post:
      operationId: createStaffHolding
      tags: [owner]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffHoldingInput" }
      responses:
        "201":
          description: Documented holding; no salary or bank mutation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffHolding" }
        "400": { description: Invalid holding }
        "404": { description: Employee not found }
  /owner/staff/{staffId}/holdings/{holdingId}/settle:
    parameters:
      - { name: staffId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      - { name: holdingId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    post:
      operationId: settleStaffHolding
      tags: [owner]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settledOn, settlementNotes]
              properties:
                settledOn: { type: string, format: date }
                settlementNotes: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        "200":
          description: Holding settled once, original amount preserved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffHolding" }
        "400": { description: Invalid settlement }
        "404": { description: Holding not found }
        "409": { description: Already settled }
  /owner/message-settings:
    get:
      operationId: getOwnerWhatsAppSettings
      tags: [owner]
      responses:
        "200":
          description: Owner-scoped message templates. A null receipt template uses the canonical default.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnerWhatsAppSettings" }
    put:
      operationId: saveOwnerWhatsAppSettings
      tags: [owner]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OwnerWhatsAppSettingsInput" }
      responses:
        "200":
          description: Saved owner-scoped message settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnerWhatsAppSettings" }
        "400":
          description: Invalid message settings
  /owner/chalets/{chaletId}/services:
    parameters:
      - { name: chaletId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      operationId: getChaletFacilities
      tags: [owner]
      responses:
        "200":
          description: Property facilities, including inactive items and per-booking quantity caps
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ChaletFacility" } }
    post:
      operationId: createChaletFacility
      tags: [owner]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/ChaletFacilityInput" }
                - { type: object, required: [name, price] }
      responses:
        "201":
          description: Created facility
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChaletFacility" }
  /owner/chalets/{chaletId}/services/{serviceId}:
    parameters:
      - { name: chaletId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      - { name: serviceId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    patch:
      operationId: updateChaletFacility
      tags: [owner]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChaletFacilityInput" }
      responses:
        "200":
          description: Updated facility
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChaletFacility" }
    delete:
      operationId: deleteChaletFacility
      tags: [owner]
      responses:
        "200":
          description: Deleted facility; historical booking snapshots are preserved
  /owner/crm/customers:
    get:
      operationId: getOwnerCrmCustomers
      tags: [owner]
      summary: Search and sort the owner customer directory before server pagination
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [all, chalet, service], default: all } }
        - { name: source, in: query, schema: { type: string, enum: [all, chalet, service], default: all } }
        - { name: providerId, in: query, schema: { type: integer, minimum: 1 } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: sort, in: query, schema: { type: string, enum: [activity, bookings, revenue], default: activity } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 } }
      responses:
        "200":
          description: At most twenty customers, full filtered count and pagination metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmCustomerPage" }
        "400": { description: Invalid directory filters }
        "404": { description: Service not found }
  /owner/crm/profile:
    get:
      operationId: getOwnerCrmProfile
      tags: [owner]
      summary: Customer summary without loading booking history
      parameters:
        - { name: phone, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 30 } }
        - { name: providerId, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Owner-scoped customer summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmCustomerSummary" }
        "404": { description: Customer or service not found }
  /owner/crm/history:
    get:
      operationId: getOwnerCrmHistory
      tags: [owner]
      summary: Paginated customer history, newest first with active bookings pinned
      parameters:
        - { name: phone, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 30 } }
        - { name: providerId, in: query, schema: { type: integer, minimum: 1 } }
        - { name: tab, in: query, schema: { type: string, enum: [bookings, contracts, insurance], default: bookings } }
        - { name: status, in: query, schema: { type: string, enum: [all, active, completed, cancelled], default: all } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: from, in: query, schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' } }
        - { name: to, in: query, schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 } }
      responses:
        "200":
          description: At most ten matching records and bounded pagination metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmHistoryPage" }
        "400": { description: Invalid filters }
        "404": { description: Service not found }
  /owner/deposits:
    get:
      operationId: getOwnerDeposits
      tags: [owner]
      summary: Owner property insurance entries with authoritative Saudi checkout instants
      responses:
        "200":
          description: All non-cancelled insured bookings for the signed-in owner
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, clientName, bookingDate, durationDays, insuranceFee, insuranceRefunded, insuranceReceived, checkoutAt]
                  properties:
                    id: { type: integer }
                    clientName: { type: string }
                    clientPhone: { type: [string, "null"] }
                    bookingDate: { type: string, format: date }
                    durationDays: { type: integer }
                    period: { type: [string, "null"] }
                    submissionId: { type: [integer, "null"] }
                    chaletTitle: { type: [string, "null"] }
                    insuranceFee: { type: string }
                    insuranceRefunded: { type: boolean }
                    insuranceReceived: { type: [boolean, "null"] }
                    insuranceDeducted: { type: [string, "null"] }
                    insuranceDeductReason: { type: [string, "null"] }
                    insuranceProofImages: { type: [string, "null"] }
                    cancelledAt: { type: [string, "null"] }
                    checkoutAt: { type: [string, "null"], format: date-time }
        "401":
          description: Authentication required
  /owner/bookings/archive:
    get:
      operationId: getOwnerBookingArchive
      tags: [owner]
      summary: Owner-scoped booking archive, filtered by stay start date, with ten records per page
      parameters:
        - { name: tab, in: query, schema: { type: string, enum: [cancelled, rescheduled, completed], default: cancelled } }
        - { name: search, in: query, schema: { type: string, maxLength: 150 } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: export, in: query, description: Return all matching records for an explicitly requested export, schema: { type: string, enum: ["1"] } }
      responses:
        "200":
          description: Filtered archive; bookings and log records retain the existing owner booking shapes
          content:
            application/json:
              schema:
                type: object
                required: [bookings, rescheduleLog, total, page, pageSize, years]
                properties:
                  bookings: { type: array, items: { $ref: "#/components/schemas/OwnerPropertyBooking" } }
                  rescheduleLog: { type: array, items: { type: object, additionalProperties: true } }
                  total: { type: integer }
                  page: { type: integer }
                  pageSize: { type: integer, const: 10 }
                  years: { type: array, items: { type: string } }
        "400":
          description: Invalid dates, range, or page
        "401":
          description: Authentication required
        "403":
          description: Owner or delegated booking access required
  /admin/partner-accounts/photographers:
    get:
      operationId: adminListPartnerPhotographers
      tags: [admin]
      summary: List photographer login accounts for authorized user managers
      responses:
        "200":
          description: Accounts, without credentials
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, name, phone, email, status, canResetPassword]
                  properties:
                    id: { type: integer }
                    name: { type: string }
                    phone: { type: string }
                    email: { type: string }
                    status: { type: string }
                    canResetPassword: { type: boolean }
        "403": { description: User-management permission required }
  /admin/partner-accounts/{kind}/{id}:
    parameters:
      - { name: kind, in: path, required: true, schema: { type: string, enum: [photographer] } }
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    patch:
      operationId: adminUpdatePartnerAccount
      tags: [admin]
      summary: Update a photographer account; owner personal information is owner-managed only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, phone, email]
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                phone: { type: string, maxLength: 30, description: Saudi mobile in local or international form; Arabic digits accepted }
                email: { type: string, maxLength: 254, description: Valid email or empty string to remove it }
      responses:
        "200":
          description: Saved atomically; account identity is unchanged
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties: { ok: { type: boolean } }
        "400": { description: Invalid profile }
        "403": { description: Owner personal information cannot be edited by administrators; user-management permission and matching origin required }
        "404": { description: Account missing }
        "409": { description: Contact already used by another account in the same role }
  /admin/partner-accounts/{kind}/{id}/password:
    parameters:
      - { name: kind, in: path, required: true, schema: { type: string, enum: [owner, photographer] } }
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    post:
      operationId: adminResetPartnerPassword
      tags: [admin]
      summary: Emergency account recovery with role-specific session revocation
      description: Owner recovery requires a nonblank reason, durable administrative audit and an available WhatsApp security sender. Failure to confirm sending aborts the change. Notifications contain no passwords and use only the stored owner phone. Incomplete photographer invitations cannot bypass legal consent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: { type: string, minLength: 10, maxLength: 72, description: Maximum 72 UTF-8 bytes; never logged or returned }
                reason: { type: string, minLength: 5, maxLength: 500, description: Mandatory for owner recovery; trimmed and persisted with the authenticated actor and target account }
      responses:
        "200":
          description: Password changed and role-specific sessions revoked
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties: { ok: { type: boolean } }
        "400": { description: Invalid password or target }
        "403": { description: User-management permission and matching origin required }
        "404": { description: Account missing }
        "409": { description: Photographer must complete registration first }
        "502": { description: WhatsApp sending unconfirmed; password change rolled back }
        "503": { description: WhatsApp security sender or auditing unavailable; password unchanged }
