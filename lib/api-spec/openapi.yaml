        description: { type: string }
        amount: { type: string }
        recordedOn: { type: string, format: date }
        notes: { type: string }
        status: { type: string, enum: [open, settled] }
        settledOn: { type: [string, "null"], format: date }
        settlementNotes: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
    OwnerWhatsAppTemplate:
      type: object
