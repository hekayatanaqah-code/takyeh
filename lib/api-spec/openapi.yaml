openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: chalets
    description: Chalet rental listings
  - name: submissions
    description: Owner chalet submission requests
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: storage
    description: Object storage operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /chalets:
    get:
      operationId: getChalets
      tags: [chalets]
      summary: List chalets
      description: Returns a list of available chalets with optional filtering
      parameters:
        - name: location
          in: query
          schema:
            type: string
          description: Filter by city name
        - name: maxGuests
          in: query
          schema:
            type: integer
          description: Minimum number of guests the chalet must accommodate
        - name: maxPrice
          in: query
          schema:
            type: number
          description: Maximum price per night
      responses:
        "200":
          description: List of chalets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Chalet"

  /chalets/{id}:
    get:
      operationId: getChaletById
      tags: [chalets]
      summary: Get chalet by ID
      description: Returns a single chalet's full details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Chalet detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chalet"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      responses:
        '302':
          description: Redirect to the returnTo path on success.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.

  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestUploadUrlBody"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestUploadUrlResponse"

  /submissions:
    get:
      operationId: getMySubmissions
      tags: [submissions]
      summary: Get the authenticated owner's chalet submissions
      responses:
        "200":
          description: List of the owner's submissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChaletSubmission"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createSubmission
      tags: [submissions]
      summary: Submit a chalet for review
      description: Allows property owners to submit their chalet for listing review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubmissionRequest"
      responses:
        "201":
          description: Submission received successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'

    ChaletSubmission:
      type: object
      properties:
        id:
          type: integer
        ownerId:
          type: [string, 'null']
        nameAr:
          type: string
        whatsappNumber:
          type: string
        location:
          type: string
        region:
          type: string
        websiteUrl:
          type: [string, 'null']
        descriptionAr:
          type: string
        pricePerNight:
          type: number
        photos:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - nameAr
        - whatsappNumber
        - location
        - descriptionAr
        - pricePerNight
        - photos
        - status
        - createdAt

    RequestUploadUrlBody:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
        size:
          type: integer
        contentType:
          type: string

    RequestUploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
        objectPath:
          type: string

    CreateSubmissionRequest:
      type: object
      properties:
        nameAr:
          type: string
          description: Chalet name in Arabic
        whatsappNumber:
          type: string
          description: Owner WhatsApp number
        location:
          type: string
          description: City name
        region:
          type: string
          description: Region name
        suggestedCityName:
          type: string
          description: Owner-proposed city when it is not in the catalog
        district:
          type: string
          description: Optional district or neighborhood name
        propertyType:
          type: string
          description: Property type (شالية، مزرعة، استراحة، مخيم)
        sections:
          type: string
          description: Number of sections (قسم واحد، قسمين منفصلة)
        mapsUrl:
          type: string
          description: Optional Google Maps or website link
        socialLink:
          type: string
          description: Instagram or Snapchat profile link for verification
        descriptionAr:
          type: string
          description: Chalet description in Arabic
        pricePerNight:
          type: number
          description: Average price per night in SAR
        amenities:
          type: array
          items:
            type: string
          description: List of selected amenity keys
        photos:
          type: array
          items:
            type: string
          description: List of object paths (up to 5)
      required:
        - nameAr
        - whatsappNumber
        - location
        - region
        - descriptionAr
        - pricePerNight

    SubmissionResponse:
      type: object
      properties:
        id:
          type: integer
        message:
          type: string
      required:
        - id
        - message

    Chalet:
      type: object
      properties:
        id:
          type: integer
        nameAr:
          type: string
          description: Chalet name in Arabic
        descriptionAr:
          type: string
          description: Chalet description in Arabic
        location:
          type: string
          description: City name in Arabic
        district:
          type: string
          nullable: true
          description: District or neighbourhood
        category:
          type: string
          nullable: true
          description: Chalet category (e.g. شالية، مزرعة)
        propertyType:
          type: string
          nullable: true
          description: Property type (شالية، مزرعة، استراحة، مخيم)
        sections:
          type: string
          nullable: true
          description: Number of sections (قسم واحد، قسمين منفصلة)
        pricePerNight:
          type: number
          description: Price per night in SAR
        priceMorning:
          type: [number, 'null']
        priceEvening:
          type: [number, 'null']
        priceFullDay:
          type: [number, 'null']
        priceWeekday:
          type: [number, 'null']
        priceWeekend:
          type: [number, 'null']
        maxGuests:
          type: integer
          description: Maximum number of guests
        bedrooms:
          type: integer
          description: Number of bedrooms
        amenities:
          type: array
          items:
            type: string
          description: List of amenities in Arabic
        photos:
          type: array
          items:
            type: string
          description: List of photo URLs
        whatsappNumber:
          type: string
          description: WhatsApp phone number for booking
        mapsUrl:
          type: string
          nullable: true
          description: Google Maps URL with exact pin coordinates (e.g. https://maps.google.com/maps?q=26.329,43.975)
        isVerified:
          type: boolean
          description: Admin-verified chalet with confirmed social media identity
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - nameAr
        - descriptionAr
        - location
        - pricePerNight
        - maxGuests
        - bedrooms
        - amenities
        - photos
        - whatsappNumber
        - createdAt
