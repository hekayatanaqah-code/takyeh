  /photography/portal:
    get:
      tags: [Photography]
      operationId: getPhotographerPortal
      responses:
        '200':
          description: Photographer profile, bookings, and earnings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotographerPortalResult"
        '401':
          description: Photographer session required
    patch:
      tags: [Photography]
      operationId: updatePhotographerProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotographerProfileInput"
      responses:
        '200':
          description: Updated photographer profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotographerProfileResult"
        '400':
          description: Invalid profile, coverage or image ownership
        '401':
          description: Photographer session required

  /submissions/check-social-account:
    post:
      operationId: checkPropertySocialAccount
      tags: [submissions]
      summary: Check Instagram or Snapchat identity before the media step
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertySocialAccountInput"
      responses:
        "200":
          description: Social account availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertySocialAccountResult"
        "400":
          description: Invalid profile link or handle
        "401":
          description: Authentication required
  /submissions/check-identity:
    post:
      operationId: checkPropertyIdentity
      tags: [submissions]
      summary: Check property identity before proceeding with registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyIdentityInput"
      responses:
        "200":
          description: Duplicate flags and an optional same-name warning
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyIdentityResult"
        "400":
          description: Invalid identity fields
        "401":
          description: Authentication required
  /submissions:
    get:
      operationId: getMySubmissions
      tags: [submissions]
      summary: Get the authenticated owner's chalet submissions
      responses:
        "200":
          description: List of the owner's submissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChaletSubmission"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createSubmission
      tags: [submissions]
      summary: Submit a chalet for review
      description: Allows property owners to submit their chalet for listing review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubmissionRequest"
      responses:
        "201":
          description: Submission received successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /owner-services:
    $ref: './owner-services.yaml#/paths/~1owner-services'
  /admin/owner-services:
    $ref: './owner-services.yaml#/paths/~1admin~1owner-services'
  /admin/owner-services/order:
    $ref: './owner-services.yaml#/paths/~1admin~1owner-services~1order'
  /admin/owner-services/{id}:
    $ref: './owner-services.yaml#/paths/~1admin~1owner-services~1{id}'
  /admin/photography/photographers/{id}/profile:
    $ref: './owner-services.yaml#/paths/~1admin~1photography~1photographers~1{id}~1profile'
components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    ServiceCityRequestInput:
      type: object
      required: [city]
      properties:
        city: { type: string, minLength: 2, maxLength: 100 }
        regionId: { type: integer, minimum: 1 }
    ServiceCityDecisionInput:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, reject] }
        regionId: { type: integer, minimum: 1 }
        reason: { type: string, maxLength: 500 }
    ServiceCityRequestRecord:
      type: object
      required: [id, city, regionId, regionName, requesterName, status, reason, createdAt, reviewedAt, approvedCityId]
      properties:
        id: { type: integer }
        city: { type: string }
        regionId: { type: [integer, "null"] }
        regionName: { type: [string, "null"] }
        requesterName: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        reason: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        reviewedAt: { type: [string, "null"], format: date-time }
        approvedCityId: { type: [integer, "null"] }
    OwnerPropertyBooking:
      type: object
      additionalProperties: true
      required: [id, bookingDate, durationDays, checkoutAt]
      properties:
        id: { type: integer }
        bookingDate: { type: string, format: date }
        durationDays: { type: integer, minimum: 1 }
        period: { type: [string, "null"] }
        checkoutAt:
          type: [string, "null"]
          format: date-time
          readOnly: true
          description: Immutable departure captured on creation or actual rescheduling. Legacy null uses midnight after the last occupied Saudi day, never current property settings.
    OwnerLedgerTransaction:
      type: object
      required: [id, date, type, label, amount, method, status, cashDeposited]
      properties:
        id: { type: string }
        date: { type: string }
        type: { type: string, enum: [income, expense, withdrawal, refund] }
        label: { type: string }
        amount: { type: number }
        method: { type: string }
        status: { type: string }
        cashDeposited: { type: [boolean, "null"] }
        paymentReceiptUrl: { type: [string, "null"] }
        bookingId: { type: [integer, "null"] }
        remainingBalance: { type: [number, "null"] }
        source: { type: string }
        providerId: { type: integer }
        appointmentId: { type: integer }
    SupportConversationReplyInput:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 2000 }
    SupportConversationEntry:
      type: object
      required: [id, author_role, body, attachment_urls, created_at]
      properties:
        id: { type: integer }
        author_role: { type: string, enum: [owner, admin] }
        body: { type: string }
        attachment_urls:
          type: array
          items: { type: string }
        created_at: { type: [string, "null"] }
    SupportConversationTicket:
      type: object
      required: [id, subject, message, status, messages]
      properties:
        id: { type: integer }
        subject: { type: string }
        message: { type: string }
        status: { type: string, enum: [new, in_progress, replied, resolved, closed] }
        admin_reply: { type: [string, "null"] }
        admin_reply_at: { type: [string, "null"] }
        is_read_by_owner: { type: boolean }
        messages:
          type: array
          items: { $ref: "#/components/schemas/SupportConversationEntry" }
    SupportConversationReplyResult:
      type: object
      required: [ok, ticket]
      properties:
        ok: { type: boolean }
        ticket: { $ref: "#/components/schemas/SupportConversationTicket" }
    QuickSalesSettings:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
    QuickSaleLine:
      type: object
      required: [name, quantity, unitPrice]
      properties:
        catalogItemId: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 150 }
        quantity: { type: integer, minimum: 1, maximum: 10000 }
        unitPrice: { type: number, minimum: 0.01, maximum: 9999999 }
    CreateQuickSale:
      type: object
      required: [providerId, dateStr, clientPhone, items, paymentMethod, idempotencyKey]
      properties:
        providerId: { type: integer, minimum: 1 }
        dateStr: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        clientName: { type: string, maxLength: 150 }
        clientPhone: { type: string, minLength: 1, maxLength: 30 }
        items:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/QuickSaleLine" }
        paymentMethod: { type: string, enum: [cash, bank] }
        notes: { type: string, maxLength: 1000 }
        idempotencyKey: { type: string, format: uuid }
    QuickSale:
      type: object
      required: [id, providerId, providerName, dateStr, clientName, items, total, paymentMethod, notes, status, createdAt]
      properties:
        id: { type: integer }
        providerId: { type: integer }
        providerName: { type: string }
        dateStr: { type: string }
        clientName: { type: string }
        clientPhone: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/QuickSaleLine" }
        total: { type: number }
        paymentMethod: { type: string, enum: [cash, bank] }
        notes: { type: string }
        status: { type: string, enum: [completed, cancelled] }
        cancellationReason: { type: string, nullable: true }
        cancelledAt: { type: string, nullable: true }
        createdAt: { type: string }
    ServiceAppointmentPaymentInput:
      type: object
      required: [amount, expectedDeposit, expectedPaymentMethod, expectedCashDeposited]
      properties:
        amount: { type: string, pattern: '^\d{1,10}(\.\d{1,2})?$' }
        expectedDeposit: { type: string, pattern: '^\d{1,10}(\.\d{1,2})?$' }
        expectedPaymentMethod: { type: string, enum: [cash, transfer, pos] }
        expectedCashDeposited: { type: boolean }
    ServiceAppointmentUpdate:
      type: object
      properties:
        clientName: { type: string, minLength: 1 }
        clientPhone: { type: string, minLength: 1 }
        serviceAddress: { type: [string, "null"] }
        serviceDeliveryMethod: { type: string, enum: [delivery_installation, customer_pickup] }
        clientIdNumber: { type: [string, "null"] }
        dateStr: { type: string, format: date }
        startTime:
          type: [string, "null"]
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Saudi local wall-clock time in HH:mm; null clears the time
        duration: { type: [string, "null"] }
        durationUnit: { type: string, enum: [hours, days] }
        status: { type: string, enum: [confirmed, pending, cancelled] }
        notes: { type: string, minLength: 1 }
        amount: { type: [string, "null"] }
        deposit: { type: [string, "null"] }
        insuranceAmount: { type: [string, "null"] }
        source: { type: string, enum: [platform, whatsapp, phone, walk_in, external] }
        paymentMethod: { type: string, enum: [cash, transfer, pos] }
        paymentReceiptUrl: { type: [string, "null"] }
        cashDeposited: { type: boolean }
        contractSigned: { type: boolean }
        cancelReason: { type: [string, "null"] }
        cancelRefundAmount: { type: [string, "null"] }
        editReason: { type: [string, "null"] }
        insuranceProofImages:
          type: array
          maxItems: 10
          items: { type: string, pattern: '^/api/storage/objects/uploads/[a-zA-Z0-9_-]+\.(webp|png|jpg|jpeg|gif|avif)$' }
          description: Stored damage-evidence image paths; omission preserves existing attachments
    ServiceAppointmentRecord:
      type: object
      required: [id, providerId, dateStr, status]
      properties:
        id: { type: integer }
        providerId: { type: integer }
        dateStr: { type: string, format: date }
        startTime: { type: [string, "null"] }
        previousStartTime: { type: [string, "null"] }
        status: { type: string }
        notes: { type: [string, "null"] }
        clientName: { type: string }
        clientPhone: { type: [string, "null"] }
        amount: { type: [string, "null"] }
        deposit: { type: [string, "null"] }
        insuranceProofImages:
          type: array
          items: { type: string }
    ProviderCatalogImageUploadInput:
      type: object
      required: [file]
      properties:
        file: { type: string, format: binary }
    ProviderCatalogImageUploadResult:
      type: object
      required: [url]
      properties:
        url: { type: string }
    ProviderCatalogItemInput:
      type: object
      required: [name, kind, price, pricingUnit, description, isActive]
      properties:
        name: { type: string, minLength: 2, maxLength: 150 }
        kind: { type: string, enum: [service, product] }
        price: { type: number, exclusiveMinimum: 0, maximum: 1000000 }
        pricingUnit: { type: string, enum: [per_request, per_hour, per_day, per_piece] }
        description: { type: string, maxLength: 2000 }
        isActive: { type: boolean }
        thumbnailUrl:
          type: [string, "null"]
          maxLength: 500
          pattern: '^/api/storage/objects/uploads/[a-zA-Z0-9_-]+\.(webp|png|jpe?g)$'
          description: Main image for this item only. Null clears it; omission preserves it on edit.
        galleryPhotos:
          type: array
          maxItems: 3
          uniqueItems: true
          description: Optional additional item images. Empty array clears them; omission preserves them on edit.
          items:
            type: string
            maxLength: 500
            pattern: '^/api/storage/objects/uploads/[a-zA-Z0-9_-]+\.(webp|png|jpe?g)$'
    ProviderCatalogItem:
      allOf:
        - { $ref: "#/components/schemas/ProviderCatalogItemInput" }
        - type: object
          required: [id, providerId]
          properties:
            id: { type: integer }
            providerId: { type: integer }
    ProviderOfferInput:
      type: object
      required: [name, itemId, discountType, value, startDate, endDate, isActive]
      properties:
        name: { type: string, minLength: 2, maxLength: 150 }
        itemId: { type: [integer, "null"], minimum: 1 }
        discountType: { type: string, enum: [percentage, fixed] }
        value: { type: number, exclusiveMinimum: 0, maximum: 1000000 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        isActive: { type: boolean }
    ProviderOffer:
      allOf:
        - { $ref: "#/components/schemas/ProviderOfferInput" }
        - type: object
          required: [id, providerId]
          properties:
            id: { type: integer }
            providerId: { type: integer }
    PublicProviderCatalogItem:
      allOf:
        - { $ref: "#/components/schemas/ProviderCatalogItem" }
        - type: object
          required: [finalPrice, offerName]
          properties:
            finalPrice: { type: number }
            offerName: { type: [string, "null"] }
    OwnerServiceRevenueSummary:
      type: object
      required: [totalRevenue, totalDeposits, totalInsurance, totalPending, byProvider]
      properties:
        totalRevenue: { type: number }
        totalDeposits: { type: number }
        totalInsurance: { type: number }
        totalPending: { type: number }
        byProvider:
          type: array
          items: { $ref: "#/components/schemas/OwnerServiceRevenueProvider" }
    OwnerServiceRevenueProvider:
      type: object
      required: [id, name, revenue, deposits, insurance, pending]
      properties:
        id: { type: integer }
        name: { type: string }
        revenue: { type: number }
        deposits: { type: number }
        insurance: { type: number }
        pending: { type: number }
    OwnerNotificationScopeInput:
      type: object
      properties:
        chaletId: { type: integer, minimum: 1 }
        submissionId: { type: integer, minimum: 1 }
        providerId: { type: integer, minimum: 1 }
    OwnerNotificationHistoryItem:
      type: object
      required: [id, type, message, isRead, createdAt]
      properties:
        id: { type: integer }
        type: { type: string }
        message: { type: string }
        isRead: { type: boolean }
        createdAt: { type: string, format: date-time }
        bookingId: { type: ["integer", "null"] }
        chaletId: { type: ["integer", "null"] }
        reviewId: { type: ["integer", "null"] }
        clientName: { type: ["string", "null"] }
        propertyName: { type: ["string", "null"] }
        submissionId: { type: ["integer", "null"] }
    PropertyOfferInput:
      type: object
      required: [submissionId, nameAr, startDate, endDate, weekdays, discountType, value, enabled]
      properties:
        submissionId: { type: integer, minimum: 1 }
        nameAr: { type: string, minLength: 1, maxLength: 120 }
        startDate: { type: string }
        endDate: { type: string }
        weekdays: { type: array, minItems: 1, maxItems: 7, uniqueItems: true, items: { type: integer, minimum: 0, maximum: 6 } }
        discountType: { type: string, enum: [percent, fixed, night_price] }
        value: { type: number, exclusiveMinimum: 0, maximum: 99999999.99 }
        enabled: { type: boolean }
    PropertyOfferPatch:
      type: object
      properties:
        nameAr: { type: string, minLength: 1, maxLength: 120 }
        startDate: { type: string }
        endDate: { type: string }
        weekdays: { type: array, minItems: 1, maxItems: 7, uniqueItems: true, items: { type: integer, minimum: 0, maximum: 6 } }
        discountType: { type: string, enum: [percent, fixed, night_price] }
        value: { type: number, exclusiveMinimum: 0, maximum: 99999999.99 }
        enabled: { type: boolean }
    PropertyOffer:
      allOf:
        - { $ref: "#/components/schemas/PropertyOfferInput" }
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id: { type: integer }
            createdAt: { type: string }
            updatedAt: { type: string }
    PropertyPriceDay:
      type: object
      required: [date, basePrice, price, offerId, offerName, badge]
      properties:
        date: { type: string }
        basePrice: { type: number }
        price: { type: number }
        offerId: { type: [integer, "null"] }
        offerName: { type: [string, "null"] }
        badge: { type: [string, "null"] }
    PropertyPriceQuote:
      type: object
      required: [basePrice, price, discountAmount, days]
      properties:
        basePrice: { type: number }
        price: { type: number }
        discountAmount: { type: number }
        days: { type: array, items: { $ref: "#/components/schemas/PropertyPriceDay" } }
    PropertySearchPrice:
      type: object
      required: [date, period, quote]
      properties:
        date: { type: string }
        period: { type: string, enum: [morning, evening, full_day] }
        quote: { $ref: "#/components/schemas/PropertyPriceQuote" }
    StaffHoldingInput:
