        profileImagePath: { type: string }
        iban: { type: string, pattern: '^SA[0-9]{4}[A-Z0-9]{18}$' }
        bankName: { type: string, minLength: 2, maxLength: 120, description: "Selected bank name or the actual manually entered other-bank name" }
        regionId: { type: integer, minimum: 1 }
        cityId: { type: integer, minimum: 1 }
        districtIds:
          type: array
          maxItems: 200
          items: { type: integer, minimum: 1 }
        allDistricts: { type: boolean }
        sessionMinutes: { type: integer, minimum: 30, maximum: 240 }
        availability:
          type: array
          maxItems: 28
          items: { $ref: "#/components/schemas/PhotographerAvailability" }
        blockedDates:
          type: array
          maxItems: 3660
          items: { type: string, format: date }
    PhotographerApplication:
      allOf:
        - $ref: "#/components/schemas/PhotographerProfileInput"
